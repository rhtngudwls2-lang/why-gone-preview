name: Publish audited Why Gone public site
on:
  push:
    branches: [main]
    paths: [WHY_GONE_PUBLIC_200_DESIGN_2026-10-04.zip, .github/workflows/pages.yml, "design-review/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: why-gone-preview-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPECTED_INDEXING: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Verify audited archive and exact publication mode
        run: |
          echo 'adb5d64f3d2ec1ee43b54f04eb4a5ff98d9b85e656ff82c015ff691a07b6a991  WHY_GONE_PUBLIC_200_DESIGN_2026-10-04.zip' | sha256sum -c -
          python3 - WHY_GONE_PUBLIC_200_DESIGN_2026-10-04.zip <<'PY'
          import os
          #!/usr/bin/env python3
          """Strict mode-aware static archive validation. No network or host-root changes."""
          import zipfile,pathlib,stat,re,json,sys,hashlib
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET
          ORIGIN='https://rhtngudwls2-lang.github.io';BASE='/why-gone-preview/'
          class Page(HTMLParser):
           def __init__(self,text):
            super().__init__();self.meta={};self.canon=[];self.schemas=[];self.ld=None;self.mail=[];self.feed(text)
           def handle_starttag(self,t,attrs):
            a=dict(attrs)
            if t=='meta':self.meta[a.get('name',a.get('property',''))]=a.get('content')
            if t=='link' and a.get('rel')=='canonical':self.canon.append(a.get('href'))
            if t=='script' and a.get('type')=='application/ld+json':self.ld=''
            if t=='a' and a.get('href','').startswith('mailto:'):self.mail.append(a['href'])
           def handle_data(self,text):
            if self.ld is not None:self.ld+=text
           def handle_endtag(self,t):
            if t=='script' and self.ld is not None:self.schemas.append(json.loads(self.ld));self.ld=None
          
          def audit(archive):
           with zipfile.ZipFile(archive) as z:
            names=z.namelist();info=json.loads(z.read('build-info.json'));indexed=info['indexing'];assert type(indexed) is bool
            assert info['recordCount']==200 and info['basePath']==BASE and info['editorIncluded'] is False and info['backendConnected'] is False
            assert len(names)==len(set(names))==(240 if indexed else 239),'exact file count'
            assert info['mode']==('production' if indexed else 'preview')
            assert info['siteOrigin']==(ORIGIN if indexed else None),'exact approved origin'
            for i in z.infolist():
             p=pathlib.PurePosixPath(i.filename);assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename and not stat.S_ISLNK(i.external_attr>>16)
             allowed=i.filename in {'index.html','404.html','robots.txt','build-info.json'} or (indexed and i.filename=='sitemap.xml') or i.filename.startswith('assets/') or re.fullmatch(r'(?:about|explore|timeline|saved|privacy|faq|contact|proposal|record/[a-z0-9-]+|collection/[a-z0-9-]+)/index\.html',i.filename)
             assert allowed,i.filename
             assert not any(x in {'src','content','editor','.private','docs','tests','deploy','admin-api','node_modules'} or x.startswith('.') for x in p.parts),i.filename
            data=json.loads(z.read('assets/records-index.json'));ids=[r['id'] for r in data];assert len(ids)==len(set(ids))==200
            details={n.split('/')[1] for n in names if re.fullmatch(r'record/[a-z0-9-]+/index\.html',n)};assert details==set(ids)
            html=[n for n in names if n.endswith('.html')];assert len(html)==213
            routes={ORIGIN+BASE+('' if n=='index.html' else n.removesuffix('index.html')) for n in html if n not in ['404.html','saved/index.html']}
            for n in html:
             p=Page(z.read(n).decode());expected='noindex,nofollow' if not indexed or n=='404.html' else 'noindex,follow' if n=='saved/index.html' else 'index,follow'
             assert p.meta.get('robots')==expected,(n,'robots')
             if indexed and n!='404.html':
              url=ORIGIN+BASE+('' if n=='index.html' else n.removesuffix('index.html'));assert p.canon==[url] and p.meta.get('og:url')==url and p.schemas,(n,'canonical/schema')
              def check_urls(value):
               if isinstance(value,dict):
                for key,v in value.items():
                 if key in ['url','item'] and isinstance(v,str):assert v.startswith(ORIGIN+BASE),(n,key,v)
                 check_urls(v)
               elif isinstance(value,list):
                for v in value:check_urls(v)
              check_urls(p.schemas)
             else:assert not p.canon and not p.meta.get('og:url') and not p.schemas,(n,'noncanonical')
            if indexed:
             urls=[e.text for e in ET.fromstring(z.read('sitemap.xml')).iter('{http://www.sitemaps.org/schemas/sitemap/0.9}loc')];assert len(urls)==len(set(urls)) and set(urls)==routes
             assert z.read('robots.txt').decode()==f'User-agent: *\nAllow: /\nSitemap: {ORIGIN}{BASE}sitemap.xml\n'
            else:assert 'sitemap.xml' not in names and z.read('robots.txt')==b'User-agent: *\nDisallow: /\n'
            for n in ['contact/index.html','faq/index.html']:
             mail=Page(z.read(n).decode()).mail;assert mail and all(u.split('?')[0]=='mailto:blueredexper@gmail.com' for u in mail)
           return {'pass':True,'indexing':indexed,'files':len(names),'html':len(html),'records':len(ids),'details':len(details),'sitemapUrls':len(routes) if indexed else 0,'origin':info['siteOrigin'],'archiveSha256':hashlib.sha256(pathlib.Path(archive).read_bytes()).hexdigest()}
          result=audit(sys.argv[1]);expected=os.environ['EXPECTED_INDEXING'];assert expected in {'true','false'};assert result['indexing']==(expected=='true'),'unexpected deployment mode';print(json.dumps(result))
          PY
          mkdir site
          unzip -q WHY_GONE_PUBLIC_200_DESIGN_2026-10-04.zip -d site
          test -f site/index.html
          test -f site/assets/app.js
      - name: Add isolated noindex design review; preserve all official bytes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil
          from html.parser import HTMLParser
          review=pathlib.Path('design-review');site=pathlib.Path('site');dest=site/'design-review'
          expected={"index.html":"a56f1dd93c4a178148831677d386fc83d055652eb335b17b68a8ffb69a95b68d","home.html":"e1c3dcf4e45edc8b66846c2618fb9b84a7863fc11d50ee6a77b06eeaa6b953bc","detail.html":"8042c486fba2aaf1782b307f93c7b7f3c97f8a6b9971dd5e88405415256f77e3","reading.html":"63df38482150b25a4a0e59d9ad3cb5895b00ecff9be5a58bb52da4c4c9da2429","timeline.html":"d1e18c55fa7388756cb4a45614ea82412d231a65d13b7f91c5204051054270f5","proposal.html":"bdd5808a1700e7f2724d2b57b955e75e6e7a0beebcabc31fabbca06cd07f1772","style.css":"48262cc41c901a6eee47b14fcc88f91b390346314453210cfb61d71aac8f17ef","prototype.js":"6ee1e89322e61ca3bafc4b5b494584019cd0238873047eab21567bc50b33fb80","assets/c2-microsoft-3d-viewer.svg":"5dd31a7937a748c7c8e699c2ef37c8634aa0b1c20af64f603d3f9ccbe0af2b70","assets/c2-adobe-flash-player.svg":"486f8e351155164cd87ee201fc53acb3d766b7a163bd1ee227c72ea28aaebbe7","intro181-20261004-v1/skype/index.html":"a41984853390e391a9e404844a19d31faf2c77e809a2fae3d20ae1ee5f70086c","intro181-20261004-v1/ipod-touch/index.html":"58f107c88d6263252d805776e5df63b17587241406431e0024389c2548b137f5","intro181-20261004-v1/microsoft-3d-viewer/index.html":"8b11d85c2e982f5ca72218c911923abcdb5208d98df44dc2e8119ad3fa791561","intro181-20261004-v1/naver-post/index.html":"0d14b69f873fbdd370d0e5fd30a0ef6cd472649c0f47b1afdca57743d2162556"}
          actual={str(p.relative_to(review)):hashlib.sha256(p.read_bytes()).hexdigest() for p in review.rglob('*') if p.is_file()}
          assert actual==expected,'exact review files and hashes required'
          class Page(HTMLParser):
           def __init__(self):super().__init__();self.robots=[];self.canonical=[]
           def handle_starttag(self,t,attrs):
            a=dict(attrs)
            if t=='meta' and a.get('name')=='robots':self.robots.append(a.get('content'))
            if t=='link' and a.get('rel')=='canonical':self.canonical.append(a.get('href'))
          for name in actual:
           if name.endswith('.html'):
            p=Page();p.feed((review/name).read_text());assert p.robots==['noindex,nofollow'] and not p.canonical,name
          assert b'design-review' not in (site/'sitemap.xml').read_bytes(),'review must be excluded from sitemap'
          assert not dest.exists(),'review target collision'
          before={str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file()}
          assert len(before)==240,'original approved publication count'
          shutil.copytree(review,dest)
          after={str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file()}
          assert all(after.get(k)==v for k,v in before.items()),'all original bytes preserved'
          assert set(after)-set(before)=={'design-review/'+k for k in expected},'review additions only'
          print(json.dumps({'pass':True,'originalFilesPreserved':len(before),'reviewFiles':len(expected),'htmlNoindex':10,'totalFiles':len(after),'sitemapUnchanged':True}))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
