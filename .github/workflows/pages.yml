name: Publish audited Why Gone preview
on:
  push:
    branches: [main]
    paths: [WHY_GONE_USER_PREVIEW_21_2026-10-02.zip, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: why-gone-preview-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify audited archive and extract static pages
        run: |
          echo '2055ad348605c749e280ae874820f4c4b0bccd5b35e98bb7010d6e31b5bb679c  WHY_GONE_USER_PREVIEW_21_2026-10-02.zip' | sha256sum -c -
          mkdir site
          unzip -q WHY_GONE_USER_PREVIEW_21_2026-10-02.zip -d site
          test -f site/index.html
          test -f site/404.html
          test -f site/assets/app.js
          test -f site/assets/style.css
          test ! -e site/_headers
          test ! -e site/editor
          test ! -e site/src
          test ! -e site/content
          test ! -e site/.private
          test ! -e site/tests
          test ! -e site/docs
          test ! -e site/deploy
          grep -q 'noindex,nofollow' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
