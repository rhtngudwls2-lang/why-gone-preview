name: Publish audited Why Gone preview
on:
  push:
    branches: [main]
    paths: [WHY_GONE_USER_PREVIEW_67_2026-10-03.zip, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: why-gone-preview-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify audited archive and extract static pages
        run: |
          echo 'dad5e72635a9b7da7d81a0117e9deec3d2aab618295ba8e1af09dda95509d482  WHY_GONE_USER_PREVIEW_67_2026-10-03.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib, stat, re, json
          with zipfile.ZipFile('WHY_GONE_USER_PREVIEW_67_2026-10-03.zip') as z:
              names=z.namelist()
              assert len(names)==len(set(names))==104
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename
                  assert not stat.S_ISLNK(i.external_attr >> 16)
                  allowed=i.filename in {'index.html','404.html','robots.txt','build-info.json'} or i.filename.startswith('assets/') or re.fullmatch(r'(?:about|explore|timeline|saved|privacy|faq|contact|proposal|record/[a-z0-9-]+|collection/[a-z0-9-]+)/index\.html',i.filename)
                  assert allowed, i.filename
                  assert not any(x in {'src','content','editor','.private','docs','tests','deploy','admin-api','node_modules'} or x.startswith('.') for x in p.parts)
                  if i.filename.endswith('.html'):assert b'noindex,nofollow' in z.read(i)
              assert json.loads(z.read('build-info.json'))['recordCount']==67
              assert b'Disallow: /' in z.read('robots.txt') and 'sitemap.xml' not in names
          PY
          mkdir site
          unzip -q WHY_GONE_USER_PREVIEW_67_2026-10-03.zip -d site
          test -f site/index.html
          test -f site/404.html
          test -f site/faq/index.html
          test -f site/contact/index.html
          test -f site/proposal/index.html
          test -f site/privacy/index.html
          test -f site/assets/app.js
          test -f site/assets/style.css
          test ! -e site/_headers
          test ! -e site/editor
          test ! -e site/src
          test ! -e site/content
          test ! -e site/.private
          test ! -e site/tests
          test ! -e site/docs
          test ! -e site/deploy
          find site -name '*.html' -exec grep -L 'noindex,nofollow' {} + > /tmp/missing-noindex
          test ! -s /tmp/missing-noindex
          grep -q '^Disallow: /$' site/robots.txt
          test ! -e site/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
